    <div class="lightbox" id="photo-lightbox" role="dialog" aria-modal="true" hidden>
      <button class="lightbox-close" type="button" aria-label="Close image">&times;</button>
      <img src="" alt="">
    </div>

    <script>
      const carouselLoops = new Map();
      const lightbox = document.getElementById("photo-lightbox");
      const lightboxImage = lightbox.querySelector("img");
      const lightboxClose = lightbox.querySelector(".lightbox-close");

      function openLightbox(link) {
        const img = link.querySelector("img");
        lightboxImage.src = link.href;
        lightboxImage.alt = img?.alt || "";
        lightbox.hidden = false;
        document.body.style.overflow = "hidden";
        lightboxClose.focus();
      }

      function closeLightbox() {
        lightbox.hidden = true;
        lightboxImage.src = "";
        document.body.style.overflow = "";
      }

      function makeCarouselImagesClickable(cards) {
        cards.forEach((card) => {
          const img = card.querySelector("img");
          if (!img || img.closest("a")) return;
          const link = document.createElement("a");
          link.href = img.currentSrc || img.src;
          link.setAttribute("aria-label", img.alt || "Open image");
          img.parentNode.insertBefore(link, img);
          link.appendChild(img);
        });
      }

      function setupInfiniteCarousel(carousel) {
        const originals = Array.from(carousel.children);
        if (!originals.length) return;
        makeCarouselImagesClickable(originals);

        originals.forEach((card) => {
          const before = card.cloneNode(true);
          const after = card.cloneNode(true);
          before.setAttribute("aria-hidden", "true");
          after.setAttribute("aria-hidden", "true");
          before.querySelectorAll("a").forEach((link) => { link.tabIndex = -1; });
          after.querySelectorAll("a").forEach((link) => { link.tabIndex = -1; });
          carousel.insertBefore(before, carousel.firstChild);
          carousel.appendChild(after);
        });

        carousel.classList.add("is-looping");
        const segmentWidth = carousel.scrollWidth / 3;
        carousel.scrollLeft = segmentWidth;

        let currentScroll = carousel.scrollLeft;
        let autoScroll = true;
        let isResetting = false;

        function normalizeScroll() {
          if (isResetting) return;
          if (carousel.scrollLeft < segmentWidth * 0.55) {
            isResetting = true;
            carousel.scrollLeft += segmentWidth;
            currentScroll = carousel.scrollLeft;
            isResetting = false;
          } else if (carousel.scrollLeft > segmentWidth * 1.45) {
            isResetting = true;
            carousel.scrollLeft -= segmentWidth;
            currentScroll = carousel.scrollLeft;
            isResetting = false;
          }
        }

        carousel.addEventListener("scroll", () => {
          currentScroll = carousel.scrollLeft;
          normalizeScroll();
        }, { passive: true });

        const hoverTarget = carousel.closest(".carousel-wrap") || carousel;
        hoverTarget.addEventListener("mouseenter", () => { autoScroll = false; });
        hoverTarget.addEventListener("mouseleave", () => { autoScroll = true; });
        hoverTarget.addEventListener("focusin", () => { autoScroll = false; });
        hoverTarget.addEventListener("focusout", () => { autoScroll = true; });

        function tick() {
          const userIsInteracting = hoverTarget.matches(":hover") || hoverTarget.matches(":focus-within");
          if (autoScroll && !userIsInteracting && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            currentScroll += 0.24;
            carousel.scrollLeft = currentScroll;
            normalizeScroll();
          }
          requestAnimationFrame(tick);
        }

        requestAnimationFrame(tick);
        carouselLoops.set(carousel.id, { carousel, segmentWidth });
      }

      function moveCarousel(id, direction) {
        const loop = carouselLoops.get(id);
        const carousel = loop?.carousel || document.getElementById(id);
        if (!carousel) return;
        carousel.scrollBy({ left: direction * 389, behavior: "smooth" });
      }

      document.querySelectorAll(".carousel").forEach(setupInfiniteCarousel);

      document.querySelectorAll("[data-carousel-prev]").forEach((button) => {
        button.addEventListener("click", () => moveCarousel(button.dataset.carouselPrev, -1));
      });

      document.querySelectorAll("[data-carousel-next]").forEach((button) => {
        button.addEventListener("click", () => moveCarousel(button.dataset.carouselNext, 1));
      });

      document.addEventListener("click", (event) => {
        const link = event.target.closest(".carousel-card a, .photo-grid a");
        if (!link) return;
        event.preventDefault();
        openLightbox(link);
      });

      lightboxClose.addEventListener("click", closeLightbox);
      lightbox.addEventListener("click", (event) => {
        if (event.target === lightbox) closeLightbox();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !lightbox.hidden) closeLightbox();
      });
    </script>
