    <div class="lightbox" id="photo-lightbox" role="dialog" aria-modal="true" hidden>
      <button class="lightbox-close" type="button" aria-label="Close image">&times;</button>
      <img src="" alt="">
    </div>

    <script>
      const carouselState = new Map();
      const lightbox = document.getElementById("photo-lightbox");
      const lightboxImage = lightbox.querySelector("img");
      const lightboxClose = lightbox.querySelector(".lightbox-close");

      function openLightbox(link) {
        const img = link.querySelector("img");
        lightboxImage.src = link.href;
        lightboxImage.alt = img?.alt || "";
        lightbox.hidden = false;
        document.body.style.overflow = "hidden";
        lightboxClose.focus();
      }

      function closeLightbox() {
        lightbox.hidden = true;
        lightboxImage.src = "";
        document.body.style.overflow = "";
      }

      function makeCarouselImagesClickable(cards) {
        cards.forEach((card) => {
          const img = card.querySelector("img");
          if (!img || img.closest("a")) return;
          const link = document.createElement("a");
          link.href = img.dataset.fullSrc || img.currentSrc || img.src;
          link.setAttribute("aria-label", img.alt || "Open image");
          img.parentNode.insertBefore(link, img);
          link.appendChild(img);
        });
      }

      function getCarouselStep(carousel) {
        const first = carousel.querySelector(".carousel-card");
        if (!first) return 0;
        const gap = parseFloat(getComputedStyle(carousel).columnGap) || 0;
        return first.getBoundingClientRect().width + gap;
      }

      function setupLoopingCarousel(carousel) {
        const cards = Array.from(carousel.children);
        if (!cards.length) return;
        makeCarouselImagesClickable(cards);
        carousel.classList.add("is-looping");

        const state = {
          autoScroll: true,
          carousel,
          currentScroll: carousel.scrollLeft,
          isAnimating: false
        };

        function rotateForward() {
          let step = getCarouselStep(carousel);
          while (step && carousel.scrollLeft >= step) {
            carousel.appendChild(carousel.firstElementChild);
            carousel.scrollLeft -= step;
            state.currentScroll = carousel.scrollLeft;
            step = getCarouselStep(carousel);
          }
        }

        function prepareBackward() {
          const step = getCarouselStep(carousel);
          if (!step || !carousel.lastElementChild) return 0;
          carousel.insertBefore(carousel.lastElementChild, carousel.firstElementChild);
          carousel.scrollLeft += step;
          state.currentScroll = carousel.scrollLeft;
          return step;
        }

        carousel.addEventListener("scroll", () => {
          state.currentScroll = carousel.scrollLeft;
        }, { passive: true });

        const hoverTarget = carousel.closest(".carousel-wrap") || carousel;
        hoverTarget.addEventListener("mouseenter", () => { state.autoScroll = false; });
        hoverTarget.addEventListener("mouseleave", () => { state.autoScroll = true; });
        hoverTarget.addEventListener("focusin", () => { state.autoScroll = false; });
        hoverTarget.addEventListener("focusout", () => { state.autoScroll = true; });

        function tick() {
          const userIsInteracting = hoverTarget.matches(":hover") || hoverTarget.matches(":focus-within");
          if (state.autoScroll && !state.isAnimating && !userIsInteracting && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            state.currentScroll += 0.24;
            carousel.scrollLeft = state.currentScroll;
            rotateForward();
          }
          requestAnimationFrame(tick);
        }

        requestAnimationFrame(tick);
        state.prepareBackward = prepareBackward;
        state.rotateForward = rotateForward;
        carouselState.set(carousel.id, state);
      }

      function moveCarousel(id, direction) {
        const state = carouselState.get(id);
        const carousel = state?.carousel || document.getElementById(id);
        if (!carousel) return;
        if (state.isAnimating) return;
        const step = direction < 0 ? state.prepareBackward() : getCarouselStep(carousel);
        if (!step) return;

        const start = carousel.scrollLeft;
        const end = start + direction * step;
        const duration = 320;
        const startedAt = performance.now();
        state.isAnimating = true;
        state.autoScroll = false;

        function animate(now) {
          const progress = Math.min(1, (now - startedAt) / duration);
          const eased = 1 - Math.pow(1 - progress, 3);
          carousel.scrollLeft = start + (end - start) * eased;
          state.currentScroll = carousel.scrollLeft;

          if (progress < 1) {
            requestAnimationFrame(animate);
            return;
          }

          carousel.scrollLeft = end;
          state.currentScroll = carousel.scrollLeft;
          if (direction > 0) state.rotateForward();
          state.isAnimating = false;
          state.autoScroll = true;
        }

        requestAnimationFrame(animate);
      }

      document.querySelectorAll(".carousel").forEach(setupLoopingCarousel);

      document.querySelectorAll("[data-carousel-prev]").forEach((button) => {
        button.addEventListener("click", () => moveCarousel(button.dataset.carouselPrev, -1));
      });

      document.querySelectorAll("[data-carousel-next]").forEach((button) => {
        button.addEventListener("click", () => moveCarousel(button.dataset.carouselNext, 1));
      });

      document.addEventListener("click", (event) => {
        const link = event.target.closest(".carousel-card a, .photo-grid a");
        if (!link) return;
        event.preventDefault();
        openLightbox(link);
      });

      lightboxClose.addEventListener("click", closeLightbox);
      lightbox.addEventListener("click", (event) => {
        if (event.target === lightbox) closeLightbox();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !lightbox.hidden) closeLightbox();
      });
    </script>
